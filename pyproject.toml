[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "go2_atomic_skills"
version = "0.4.4"   # 0.4.4: asset loader works on torch < 1.13 (robot env); 0.4.3: landing latch ON by default; see docs/PATCHES.md
description = "Two trained Unitree Go2 policies (joystick walker + reach-avoid gap-jump) packaged as reusable, MuJoCo-native atomic skills. Runtime needs only numpy + torch (+ mujoco for the scene bridge)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0"]

[tool.setuptools]
packages = ["go2_atomic_skills"]

[tool.setuptools.package-data]
go2_atomic_skills = [
  "assets/extracted/*",
  "assets/go2_mjcf/*.xml",
  "assets/go2_mjcf/assets/*",
]
